<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>퇴근하기</title><meta name="description" content="퇴근하기">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='7' width='26' height='20' rx='6' fill='%23ed4429'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css"><script src="app.js" defer></script>
</head>
<body>
<main>
<time id="clock" aria-label="한국 현재 시각"><span id="hours">00</span><span class="colon">:</span><span id="minutes">00</span><span class="seconds" id="seconds">00</span></time>
<section class="control" aria-label="퇴근하기">
<output id="count" aria-label="누른 횟수">0</output>
<div class="button-wrap">
<div id="particles" aria-hidden="true"></div>
<button id="hit"><span class="face" id="face"><span id="hitLabel">퇴근하기</span></span></button>
</div>
<span id="status" class="sr-only" role="status"></span>
</section>
</main>
</body>
</html>
